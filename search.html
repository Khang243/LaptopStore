<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — LaptopStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="container">
    <div style="padding: 32px 0 0">
      <div class="label-eyebrow">Search</div>
      <h1>Find a product</h1>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" class="form-input" placeholder="Search by name, category, or spec…"
        autofocus>
      <button class="btn btn-primary" id="search-btn">Search</button>
    </div>

    <div class="cat-toolbar">
      <div class="cat-filters" id="search-cat-filters">
        <!-- Filled by JS -->
      </div>
    </div>

    <div class="search-results-head">
      <span class="count" id="results-count">Type to search…</span>
    </div>

    <div class="product-grid" id="search-results">
      <div class="empty-state" style="grid-column:1/-1">
        <div class="es-icon">🔍</div>
        <h3>Start searching</h3>
        <p>Enter a keyword above to find products across all categories.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
