<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — LaptopStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="container">
    <div style="padding: 32px 0 0">
      <div class="label-eyebrow">Account</div>
      <h1>Settings</h1>
    </div>

    <div class="settings-layout">
      <nav class="settings-nav">
        <a href="#profile" class="active" data-panel="profile">Profile</a>
        <a href="#security" data-panel="security">Security</a>
        <a href="#preferences" data-panel="preferences">Preferences</a>
      </nav>

      <!-- Profile panel -->
      <div id="panel-profile" class="settings-panel">
        <h2>Profile</h2>
        <p class="sub">Update your personal information.</p>
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input type="text" id="profile-name" class="form-input" placeholder="Your name">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="profile-email" class="form-input" disabled>
            <div class="form-hint">Email cannot be changed. Contact support if needed.</div>
          </div>
          <div class="form-group">
            <label class="form-label">Phone (optional)</label>
            <input type="tel" id="profile-phone" class="form-input" placeholder="+1 (555) 000-0000">
          </div>
          <div class="form-group">
            <label class="form-label">Address (optional)</label>
            <textarea id="profile-address" class="form-textarea" placeholder="Shipping address"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
      </div>

      <!-- Security panel -->
      <div id="panel-security" class="settings-panel" style="display:none">
        <h2>Security</h2>
        <p class="sub">Change your password.</p>
        <form id="security-form">
          <div class="form-group">
            <label class="form-label">Current password</label>
            <input type="password" id="current-pass" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">New password</label>
            <input type="password" id="new-pass" class="form-input" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm new password</label>
            <input type="password" id="confirm-pass" class="form-input" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>
      </div>

      <!-- Preferences panel -->
      <div id="panel-preferences" class="settings-panel" style="display:none">
        <h2>Preferences</h2>
        <p class="sub">Customize your experience.</p>
        <div class="form-group">
          <label class="form-label">Currency</label>
          <select class="form-select" id="pref-currency">
            <option value="USD">USD — US Dollar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Email notifications</label>
          <select class="form-select" id="pref-notif">
            <option value="all">All notifications</option>
            <option value="orders">Orders only</option>
            <option value="none">No notifications</option>
          </select>
        </div>
        <button class="btn btn-primary" id="pref-save">Save preferences</button>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
